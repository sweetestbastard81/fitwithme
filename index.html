<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitwithme</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#1d2733; --muted:#6b7785; --brand:#1f4e78; --ok:#1e8e3e; --warn:#c5221f; --amber:#b06000; --line:#e3e7ec; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); font-size:15px; }
  .wrap { max-width:640px; margin:0 auto; padding:12px 12px 40px; }
  header { background:var(--brand); color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  header b { font-size:16px; } header small { display:block; opacity:.8; font-size:12px; }
  header button { background:transparent; border:1px solid #fff8; color:#fff; border-radius:6px; padding:4px 10px; }
  #notifBar { display:none; }
  .notifbanner { background:#fef7e0; color:var(--amber); padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer; border-bottom:1px solid var(--line); }
  .tabs { display:flex; gap:6px; margin:12px 0; }
  .tabs button { flex:1; padding:10px 0; border:0; border-radius:8px; background:#e3e7ec; font-weight:600; font-size:12.5px; color:var(--text); }
  .tabs button.on { background:var(--brand); color:#fff; }
  .card { background:var(--card); border-radius:12px; padding:14px; margin-bottom:10px; box-shadow:0 1px 2px #0001; }
  .card.unread { border-left:4px solid var(--amber); }
  .card h3 { margin:0 0 4px; font-size:16px; }
  h4 { margin:16px 0 8px; font-size:14px; color:var(--muted); }
  .muted { color:var(--muted); font-size:13px; }
  .warnline { color:var(--warn); font-size:13px; font-weight:600; }
  .row { display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .jrow { border-top:1px solid var(--line); padding-top:6px; margin-top:6px; }
  .stat { background:var(--bg); border-radius:8px; padding:8px 10px; }
  .stat small { display:block; color:var(--muted); font-size:12px; }
  .stat b { font-size:16px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; font-weight:600; background:#e8f0fe; color:var(--brand); white-space:nowrap; }
  .badge.ok { background:#e6f4ea; color:var(--ok); }
  .badge.bad { background:#fce8e6; color:var(--warn); }
  .badge.amber { background:#fef7e0; color:var(--amber); }
  input, select { width:100%; padding:10px; margin:4px 0 8px; border:1px solid var(--line); border-radius:8px; font-size:15px; background:#fff; font-family:inherit; }
  label { font-size:13px; color:var(--muted); }
  button.primary { width:100%; padding:12px; border:0; border-radius:8px; background:var(--brand); color:#fff; font-size:15px; font-weight:600; }
  button.link { background:none; border:0; color:var(--brand); padding:6px 0; font-size:14px; text-decoration:underline; }
  button.del { background:none; border:0; color:var(--warn); font-size:13px; padding:6px 0; }
  a.wa { color:#128c7e; font-size:14px; font-weight:600; text-decoration:none; padding:6px 0; }
  button:disabled { opacity:.6; }
  .actions { display:flex; flex-wrap:wrap; gap:2px 16px; margin-top:8px; align-items:center; }
  .msg { min-height:20px; margin-top:8px; font-size:14px; color:var(--warn); }
  .msg.info { color:var(--ok); }
  details.card summary { font-weight:600; cursor:pointer; }
  .item select { width:auto; margin:0; padding:4px 6px; font-size:13px; }
  .empty { text-align:center; color:var(--muted); padding:20px; }
  .bar { height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:8px; }
  .bar > div { height:100%; background:var(--brand); }
  .bar.over > div { background:var(--amber); }
</style>
</head>
<body>

<div id="loadView" class="wrap muted" style="padding-top:80px;text-align:center">Memuat...</div>

<div id="loginView" class="wrap" style="padding-top:60px;display:none">
  <div class="card">
    <h3 style="font-size:20px">Fitwithme</h3>
    <p class="muted" id="loginHint">Masuk dengan email dan password.</p>
    <label>Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="nama@email.com">
    <label>Password</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="Minimal 6 karakter">
    <button class="primary" id="authBtn">Masuk</button>
    <div class="row" style="margin-top:8px">
      <button class="link" id="switchBtn">Belum punya akun? Daftar</button>
      <button class="link" id="resetBtn">Lupa password</button>
    </div>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<div id="appView" style="display:none">
  <header><div><b id="hdrName"></b><small id="hdrEmail"></small></div><button id="logoutBtn">Keluar</button></header>
  <div id="notifBar"></div>
  <div class="wrap">
    <div class="tabs" id="tabs"></div>
    <div id="panel"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendEmailVerification, sendPasswordResetEmail }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, query, where, writeBatch, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzsNcK6gLRrSC8Q7LABnML9iXZ9gHRqbI",
  authDomain: "fitwithme-28087.firebaseapp.com",
  projectId: "fitwithme-28087",
  storageBucket: "fitwithme-28087.firebasestorage.app",
  messagingSenderId: "540323289071",
  appId: "1:540323289071:web:3ae8b1841d72b914a3c81a"
};

// ===== PENGATURAN (ubah di sini jika perlu) =====
const TARIF_VISIT = 100000;   // coaching: per visit
const TARIF_MEMBER = 220000;  // member: per periode
const PERIODE_HARI = 30;      // lama satu periode (hari)
const NAMA_USAHA = 'Fitwithme';
// Jadwal rutin default per minggu (hari: 0=Minggu, 1=Senin, ... 3=Rabu, 5=Jumat, 6=Sabtu)
const RUTIN_DEFAULT = [
  { hari: 3, mulai: '12:30', selesai: '13:30' },  // Rabu
  { hari: 5, mulai: '11:30', selesai: '12:30' }   // Jumat
];
// ================================================

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const fmtTgl = iso => String(iso || '').split('-').reverse().join('/');
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const diffDays = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000);
const waNumber = raw => { let n = String(raw || '').replace(/\D/g, ''); if (n.startsWith('0')) n = '62' + n.slice(1); else if (n.startsWith('8')) n = '62' + n; return n; };

const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const HARI_OPTS = [['', 'Tidak dipakai'], ['1', 'Senin'], ['2', 'Selasa'], ['3', 'Rabu'], ['4', 'Kamis'], ['5', 'Jumat'], ['6', 'Sabtu'], ['0', 'Minggu']];
const dayOf = iso => new Date(iso + 'T00:00:00Z').getUTCDay();
const hariTgl = iso => iso ? HARI[dayOf(iso)] + ', ' + fmtTgl(iso) : '';
const waktuText = iso => { try { return new Date(iso).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return ''; } };

const rutinOf = c => Array.isArray(c.rutin) ? c.rutin : RUTIN_DEFAULT;
const rutinText = c => { const r = rutinOf(c); return r.length ? r.map(x => HARI[x.hari] + ' ' + x.mulai + '–' + x.selesai).join(', ') : 'belum diatur'; };

// Hasilkan n jadwal berikutnya (mulai dari tanggal fromIso) sesuai jadwal rutin client
function nextRutin(c, n, fromIso) {
  const slots = rutinOf(c).filter(x => x && x.mulai && x.selesai);
  const out = [];
  if (!slots.length) return out;
  let d = fromIso;
  for (let i = 0; i < 400 && out.length < n; i++, d = addDays(d, 1)) {
    slots.filter(x => Number(x.hari) === dayOf(d)).forEach(x => {
      if (out.length < n) out.push({ tanggal: d, mulai: x.mulai, selesai: x.selesai });
    });
  }
  return out;
}

let S = { role: '', email: '', clients: [], jadwal: [], bayar: [], visit: [], notif: [] };
let TAB = 'ringkasan';
let EDIT_ID = null;
let RESCH_ID = null;
let STALE = false;
let unsubNotif = null;
let registerMode = false;
let busyAuth = false;

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in (props || {})) {
    if (k === 'class') e.className = props[k];
    else if (k.slice(0, 2) === 'on') e[k] = props[k];
    else if (k === 'value') e.value = props[k];
    else e.setAttribute(k, props[k]);
  }
  kids.flat().forEach(c => { if (c != null) e.append(c instanceof Node ? c : document.createTextNode(String(c))); });
  return e;
}

function show(view) {
  ['loadView', 'loginView', 'appView'].forEach(v => $(v).style.display = (v === view ? 'block' : 'none'));
}
function setMsg(text, info) { $('loginMsg').textContent = text || ''; $('loginMsg').className = 'msg' + (info ? ' info' : ''); }

function friendly(e) {
  const m = {
    'auth/invalid-credential': 'Email atau password salah.',
    'auth/wrong-password': 'Email atau password salah.',
    'auth/user-not-found': 'Email atau password salah.',
    'auth/invalid-email': 'Format email tidak valid.',
    'auth/email-already-in-use': 'Email sudah terdaftar. Coba masuk atau gunakan Lupa password.',
    'auth/weak-password': 'Password minimal 6 karakter.',
    'auth/too-many-requests': 'Terlalu banyak percobaan. Coba lagi nanti.',
    'auth/network-request-failed': 'Tidak ada koneksi internet.',
    'permission-denied': 'Akses ditolak oleh aturan database. Pastikan Rules terbaru sudah di-Publish.'
  };
  return m[e.code] || ('Terjadi kesalahan: ' + (e.message || e));
}

// ---------- Auth ----------
$('switchBtn').onclick = () => {
  registerMode = !registerMode;
  $('authBtn').textContent = registerMode ? 'Daftar' : 'Masuk';
  $('switchBtn').textContent = registerMode ? 'Sudah punya akun? Masuk' : 'Belum punya akun? Daftar';
  $('loginHint').textContent = registerMode
    ? 'Daftar dengan email yang sama dengan yang didaftarkan trainer-mu.'
    : 'Masuk dengan email dan password.';
  setMsg('');
};

$('authBtn').onclick = async () => {
  const email = $('email').value.trim(), pass = $('pass').value;
  if (!email || !pass) return setMsg('Email dan password wajib diisi.');
  $('authBtn').disabled = true; setMsg('');
  try {
    if (registerMode) {
      busyAuth = true;
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await sendEmailVerification(cred.user);
      await signOut(auth);
      busyAuth = false;
      registerMode = false;
      $('authBtn').textContent = 'Masuk';
      $('switchBtn').textContent = 'Belum punya akun? Daftar';
      $('loginHint').textContent = 'Masuk dengan email dan password.';
      setMsg('Akun dibuat. Cek email (juga folder spam), klik link verifikasi, lalu masuk di sini.', true);
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
  } catch (e) {
    busyAuth = false;
    setMsg(friendly(e));
  }
  $('authBtn').disabled = false;
};

$('pass').addEventListener('keydown', e => { if (e.key === 'Enter') $('authBtn').click(); });

$('resetBtn').onclick = async () => {
  const email = $('email').value.trim();
  if (!email) return setMsg('Isi email dulu, lalu ketuk Lupa password.');
  try { await sendPasswordResetEmail(auth, email); setMsg('Link reset password dikirim ke email (cek folder spam).', true); }
  catch (e) { setMsg(friendly(e)); }
};

$('logoutBtn').onclick = () => signOut(auth);

function stopNotifListener() { if (unsubNotif) { unsubNotif(); unsubNotif = null; } document.title = NAMA_USAHA; }

// Pantau pemberitahuan secara langsung (hanya trainer)
function startNotifListener() {
  stopNotifListener();
  let first = true;
  unsubNotif = onSnapshot(collection(db, 'notif'), snap => {
    S.notif = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => String(b.dibuat).localeCompare(String(a.dibuat)));
    if (!first && snap.docChanges().some(c => c.type === 'added')) STALE = true;
    first = false;
    renderTabs(); renderBar();
    if (TAB === 'notif') renderPanel();
  }, err => console.error(err));
}

onAuthStateChanged(auth, async user => {
  if (busyAuth) return;
  if (!user) { stopNotifListener(); show('loginView'); return; }
  show('loadView');
  try {
    await user.reload();
    if (!user.emailVerified) {
      try { await sendEmailVerification(user); } catch (e) {}
      await signOut(auth);
      show('loginView');
      setMsg('Email belum diverifikasi. Link verifikasi dikirim ulang, cek email (juga spam), klik linknya, lalu masuk lagi.');
      return;
    }
    await user.getIdToken(true);
    await loadData(user);
    TAB = 'ringkasan'; EDIT_ID = null; RESCH_ID = null; STALE = false;
    if (S.role === 'trainer') startNotifListener();
    render();
    show('appView');
  } catch (e) {
    await signOut(auth);
    show('loginView');
    setMsg(friendly(e));
  }
});

// ---------- Data ----------
async function loadData(user) {
  const email = user.email.toLowerCase();
  S = { role: 'client', email, clients: [], jadwal: [], bayar: [], visit: [], notif: [] };
  const map = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
  let trainer = false;
  try {
    S.clients = map(await getDocs(collection(db, 'clients')));
    trainer = true;
  } catch (e) {
    if (e.code !== 'permission-denied') throw e;
  }
  if (trainer) {
    S.role = 'trainer';
    S.jadwal = map(await getDocs(collection(db, 'jadwal')));
    S.bayar = map(await getDocs(collection(db, 'pembayaran')));
    S.visit = map(await getDocs(collection(db, 'visit')));
    S.notif = map(await getDocs(collection(db, 'notif')));
  } else {
    const q = (col, f) => getDocs(query(collection(db, col), where(f, '==', email)));
    S.clients = map(await q('clients', 'email'));
    S.jadwal = map(await q('jadwal', 'clientEmail'));
    S.bayar = map(await q('pembayaran', 'clientEmail'));
    S.visit = map(await q('visit', 'clientEmail'));
  }
  S.clients.sort((a, b) => String(a.nama).localeCompare(String(b.nama)));
  S.jadwal.sort((a, b) => (a.tanggal + a.mulai).localeCompare(b.tanggal + b.mulai));
  S.bayar.forEach(b => { if (b.status !== 'Lunas') b.status = 'Belum Dibayar'; });
  S.bayar.sort((a, b) => String(b.tanggal).localeCompare(String(a.tanggal)));
  S.visit.sort((a, b) => String(b.tanggal).localeCompare(String(a.tanggal)));
  S.notif.sort((a, b) => String(b.dibuat).localeCompare(String(a.dibuat)));
}

// Jalankan aksi, muat ulang data, tampilkan ulang. Mengembalikan true jika berhasil.
async function act(fn) {
  try { await fn(); await loadData(auth.currentUser); render(); return true; }
  catch (e) { alert(friendly(e)); try { await loadData(auth.currentUser); render(); } catch (_) {} return false; }
}

// Banyak operasi tulis sekaligus (dipecah per 400 agar aman dari batas Firestore)
async function runBatched(ops) {
  for (let i = 0; i < ops.length; i += 400) {
    const b = writeBatch(db);
    ops.slice(i, i + 400).forEach(f => f(b));
    await b.commit();
  }
}

// ---------- Logika paket, periode, kuota ----------
function summaryOf(c) {
  const coaching = Number(c.coaching || 0);
  const mulai = c.periodeMulai || c.tanggalMulai || today();
  const selesai = addDays(mulai, PERIODE_HARI);
  const used = S.visit.filter(v => v.clientEmail === c.email && v.tanggal >= mulai && v.tanggal < selesai).length;
  const pays = S.bayar.filter(b => b.clientEmail === c.email);
  const sum = list => list.reduce((s, b) => s + Number(b.jumlah || 0), 0);
  return {
    ...c, coaching, member: !!c.member, mulai, selesai,
    kuota: coaching, used, sisa: coaching - used,
    hariSisa: diffDays(today(), selesai),
    biayaCoaching: coaching * TARIF_VISIT, biayaMember: c.member ? TARIF_MEMBER : 0,
    adaTagihan: pays.length > 0,
    belum: sum(pays.filter(b => b.status !== 'Lunas')),
    lunas: sum(pays.filter(b => b.status === 'Lunas'))
  };
}

function paketLabel(c) {
  const p = [];
  if (Number(c.coaching) > 0) p.push('Coaching ' + c.coaching + 'x visit');
  if (c.member) p.push('Member');
  return p.length ? p.join(' + ') : 'Belum ada paket';
}

function tagihanOps(c, mulai) {
  const per = fmtTgl(mulai) + ' – ' + fmtTgl(addDays(mulai, PERIODE_HARI));
  const base = { clientEmail: c.email, clientNama: c.nama, tanggal: today(), metode: '', status: 'Belum Dibayar', tanggalBayar: '', periodeMulai: mulai };
  const ops = [];
  if (Number(c.coaching) > 0) ops.push(b => b.set(doc(collection(db, 'pembayaran')),
    { ...base, jenis: 'Coaching', jumlah: c.coaching * TARIF_VISIT, ket: 'Coaching ' + c.coaching + 'x visit · periode ' + per }));
  if (c.member) ops.push(b => b.set(doc(collection(db, 'pembayaran')),
    { ...base, jenis: 'Member', jumlah: TARIF_MEMBER, ket: 'Member · periode ' + per }));
  return ops;
}

function waLink(s) {
  const msg = 'Halo kak ' + s.nama + '! 👋\n\nSekedar mengingatkan kalo kakak masih punya ' + s.sisa +
    ' jatah visit coaching yang bisa dipakai di periode ' + PERIODE_HARI + ' hari ini (sampai ' + fmtTgl(s.selesai) +
    ').\n\nYuk jadwalkan sesi latihan sebelum kuota hangus ya. Ditunggu konfirmasinya! 💪';
  return 'https://wa.me/' + waNumber(s.wa) + '?text=' + encodeURIComponent(msg);
}

// Jadwal client lain yang bertabrakan waktunya
function bentrok(tanggal, mulai, selesai, email, exceptId) {
  return S.jadwal.filter(j => j.id !== exceptId && j.clientEmail !== email && j.status !== 'Batal'
    && j.tanggal === tanggal && j.mulai < selesai && mulai < j.selesai);
}

// ---------- UI umum ----------
const isTrainer = () => S.role === 'trainer';
const unreadCount = () => S.notif.filter(n => !n.dibaca).length;

function goTab(t) {
  TAB = t; RESCH_ID = null;
  if (STALE && (t === 'notif' || t === 'jadwal')) { STALE = false; act(async () => {}); }
  else render();
}

function renderTabs() {
  const tabs = [['ringkasan', 'Ringkasan'], ['jadwal', 'Jadwal'], ['visit', 'Visit'], ['bayar', 'Bayar']];
  if (isTrainer()) tabs.push(['notif', 'Notif' + (unreadCount() ? ' (' + unreadCount() + ')' : '')]);
  $('tabs').replaceChildren(...tabs.map(t => el('button', { class: TAB === t[0] ? 'on' : '', onclick: () => goTab(t[0]) }, t[1])));
}

function renderBar() {
  const bar = $('notifBar');
  const n = isTrainer() ? unreadCount() : 0;
  document.title = (n ? '(' + n + ') ' : '') + NAMA_USAHA;
  if (!n || TAB === 'notif') { bar.style.display = 'none'; bar.replaceChildren(); return; }
  bar.style.display = 'block';
  bar.replaceChildren(el('div', { class: 'notifbanner', onclick: () => goTab('notif') }, '🔔 ' + n + ' perubahan jadwal baru dari client · ketuk untuk lihat'));
}

function renderPanel() {
  const v = { ringkasan: viewRingkasan, jadwal: viewJadwal, visit: viewVisit, bayar: viewBayar, notif: viewNotif }[TAB];
  $('panel').replaceChildren(...v());
}

function render() {
  $('hdrName').textContent = isTrainer() ? 'Trainer' : (S.clients[0] ? 'Halo, ' + S.clients[0].nama : NAMA_USAHA);
  $('hdrEmail').textContent = S.email;
  renderTabs(); renderBar(); renderPanel();
}

const stat = (l, v) => el('div', { class: 'stat' }, el('small', {}, l), el('b', {}, v));
const val = id => $(id).value.trim();

function clientSelect(id, list) {
  return el('select', { id }, (list || S.clients).map(c => el('option', { value: c.email }, c.nama + ' (' + c.email + ')')));
}
function namaOf(email) { const c = S.clients.find(x => x.email === email); return c ? c.nama : email; }
function select(id, opts, value) {
  const s = el('select', { id }, opts.map(([v, t]) => el('option', { value: v }, t)));
  s.value = value; return s;
}
function statusSelect(list, current, onChange) {
  const s = el('select', {}, list.map(v => el('option', { value: v }, v)));
  s.value = current;
  s.onchange = () => { s.disabled = true; act(() => onChange(s.value)); };
  return s;
}
function badgeFor(status) {
  const cls = { Selesai: 'ok', Lunas: 'ok', Batal: 'bad', 'Belum Dibayar': 'bad' }[status] || '';
  return el('span', { class: 'badge ' + cls }, status);
}
function delBtn(col, id) {
  return el('button', { class: 'del', onclick: () => { if (confirm('Hapus data ini?')) act(() => deleteDoc(doc(db, col, id))); } }, 'Hapus');
}

// ---------- Form client (dipakai untuk tambah & edit) ----------
function clientFields(p, c) {
  const info = el('div', { class: 'muted', style: 'margin-bottom:8px' });
  const coaching = select(p + '_coaching', [
    ['0', 'Tanpa coaching'],
    ['4', 'Coaching 4x visit / periode (' + rp(4 * TARIF_VISIT) + ')'],
    ['8', 'Coaching 8x visit / periode (' + rp(8 * TARIF_VISIT) + ')']
  ], String(c.coaching || 0));
  const member = select(p + '_member', [
    ['tidak', 'Tanpa member'],
    ['ya', 'Member ' + PERIODE_HARI + ' hari (' + rp(TARIF_MEMBER) + ')']
  ], c.member ? 'ya' : 'tidak');
  const upd = () => {
    const bc = Number(coaching.value) * TARIF_VISIT, bm = member.value === 'ya' ? TARIF_MEMBER : 0;
    info.textContent = 'Biaya per periode: Coaching ' + rp(bc) + ' + Member ' + rp(bm) + ' = ' + rp(bc + bm);
  };
  coaching.onchange = upd; member.onchange = upd; upd();

  const rutin = rutinOf(c);
  const slots = [0, 1].map(i => {
    const r = rutin[i] || {};
    return el('div', { class: 'jrow' },
      el('label', {}, 'Slot ' + (i + 1)),
      select(p + '_h' + i, HARI_OPTS, r.hari != null ? String(r.hari) : ''),
      el('div', { class: 'two' },
        el('input', { id: p + '_rm' + i, type: 'time', value: r.mulai || '' }),
        el('input', { id: p + '_rs' + i, type: 'time', value: r.selesai || '' })));
  });

  return [
    el('label', {}, 'Nama'), el('input', { id: p + '_nama', value: c.nama || '' }),
    el('label', {}, 'Email (harus sama dengan email yang dipakai client untuk daftar)'), el('input', { id: p + '_email', type: 'email', value: c.email || '' }),
    el('label', {}, 'No WhatsApp'), el('input', { id: p + '_wa', inputmode: 'tel', placeholder: '08xxxxxxxxxx', value: c.wa || '' }),
    el('label', {}, 'Paket coaching'), coaching,
    el('label', {}, 'Member'), member,
    info,
    el('label', {}, 'Tanggal mulai periode (berlaku ' + PERIODE_HARI + ' hari)'), el('input', { id: p + '_mulai', type: 'date', value: c.periodeMulai || c.tanggalMulai || today() }),
    el('h4', {}, 'Jadwal rutin mingguan (jam mulai & selesai)'),
    ...slots
  ];
}

function readClient(p) {
  const d = {
    nama: val(p + '_nama'), email: val(p + '_email').toLowerCase(), wa: val(p + '_wa'),
    coaching: Number($(p + '_coaching').value), member: $(p + '_member').value === 'ya',
    periodeMulai: val(p + '_mulai'), rutin: []
  };
  if (!d.nama || !d.email) return { err: 'Nama dan email wajib diisi.' };
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.periodeMulai)) return { err: 'Tanggal mulai periode wajib diisi.' };
  for (const i of [0, 1]) {
    const h = $(p + '_h' + i).value, m = val(p + '_rm' + i), s = val(p + '_rs' + i);
    if (h === '') continue;
    if (!m || !s || s <= m) return { err: 'Jadwal rutin slot ' + (i + 1) + ': jam mulai dan selesai harus diisi dengan benar.' };
    d.rutin.push({ hari: Number(h), mulai: m, selesai: s });
  }
  return { d };
}

function addClientCard() {
  const btn = el('button', { class: 'primary' }, 'Simpan client');
  btn.onclick = () => {
    const r = readClient('a');
    if (r.err) return alert(r.err);
    const d = r.d;
    if (S.clients.some(x => x.email === d.email)) return alert('Email ini sudah terdaftar sebagai client lain.');
    btn.disabled = true;
    act(async () => {
      const ops = [b => b.set(doc(collection(db, 'clients')), d)];
      if ($('a_tagihan').value === 'ya') ops.push(...tagihanOps(d, d.periodeMulai));
      await runBatched(ops);
    });
  };
  return el('details', { class: 'card' }, el('summary', {}, '+ Tambah client'),
    clientFields('a', {}),
    el('label', {}, 'Buat tagihan otomatis untuk periode ini?'),
    select('a_tagihan', [['ya', 'Ya, buat tagihan (status Belum Dibayar)'], ['tidak', 'Tidak']], 'ya'),
    btn);
}

function editCard(c) {
  const save = el('button', { class: 'primary' }, 'Simpan perubahan');
  save.onclick = () => {
    const r = readClient('e');
    if (r.err) return alert(r.err);
    const d = r.d;
    if (S.clients.some(x => x.id !== c.id && x.email === d.email)) return alert('Email sudah dipakai client lain.');
    save.disabled = true;
    act(async () => {
      const ops = [b => b.update(doc(db, 'clients', c.id), d)];
      // Jika nama/email berubah, perbarui data milik client ini
      if (d.nama !== c.nama || d.email !== c.email) {
        const patch = { clientEmail: d.email, clientNama: d.nama };
        [['jadwal', S.jadwal], ['pembayaran', S.bayar], ['visit', S.visit], ['notif', S.notif]].forEach(([col, list]) =>
          list.filter(x => x.clientEmail === c.email).forEach(x => ops.push(b => b.update(doc(db, col, x.id), patch))));
      }
      await runBatched(ops);
      EDIT_ID = null;
    });
  };
  return el('div', { class: 'card' }, el('h3', {}, 'Edit client'),
    clientFields('e', c),
    el('div', { class: 'muted', style: 'margin-bottom:8px' }, 'Mengubah paket tidak mengubah tagihan yang sudah dibuat. Atur tagihan di tab Bayar.'),
    save,
    el('button', { class: 'link', onclick: () => { EDIT_ID = null; render(); } }, 'Batal'));
}

function perpanjang(s) {
  const tgl = prompt('Tanggal mulai periode baru (format yyyy-mm-dd):', s.selesai);
  if (!tgl) return;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(tgl)) return alert('Format tanggal harus yyyy-mm-dd, contoh 2026-12-01.');
  const total = s.biayaCoaching + s.biayaMember;
  const ket = total > 0
    ? '\n\nTagihan baru dibuat otomatis: ' + rp(total) + ' (status Belum Dibayar).'
    : '\n\nClient belum punya paket, tidak ada tagihan yang dibuat.';
  if (!confirm('Mulai periode baru untuk ' + s.nama + ' pada ' + fmtTgl(tgl) + '?\nKuota visit dihitung ulang dari tanggal tersebut.' + ket)) return;
  act(() => runBatched([b => b.update(doc(db, 'clients', s.id), { periodeMulai: tgl }), ...tagihanOps(s, tgl)]));
}

function deleteClient(c) {
  const rel = col => S[col].filter(x => x.clientEmail === c.email);
  const js = rel('jadwal'), bs = rel('bayar'), vs = rel('visit'), ns = rel('notif');
  if (!confirm('Hapus client ' + c.nama + '?\n\nIkut terhapus: ' + js.length + ' jadwal, ' + vs.length + ' visit, dan ' + bs.length + ' pembayaran.\nTindakan ini tidak bisa dibatalkan.')) return;
  act(async () => {
    const ops = [b => b.delete(doc(db, 'clients', c.id))];
    [['jadwal', js], ['pembayaran', bs], ['visit', vs], ['notif', ns]].forEach(([col, list]) =>
      list.forEach(x => ops.push(b => b.delete(doc(db, col, x.id)))));
    await runBatched(ops);
  });
}

// ---------- Tab Ringkasan ----------
function clientCard(s) {
  const T = isTrainer();
  const badge = s.belum > 0 ? el('span', { class: 'badge bad' }, 'Belum bayar')
    : (s.adaTagihan ? el('span', { class: 'badge ok' }, 'Lunas') : null);
  const periode = fmtTgl(s.mulai) + ' – ' + fmtTgl(s.selesai) + (s.hariSisa > 0 ? ' (sisa ' + s.hariSisa + ' hari)' : ' (periode berakhir)');
  const kids = [
    el('div', { class: 'row' }, el('h3', {}, s.nama), badge),
    el('div', { class: 'muted' }, [paketLabel(s), T ? s.email : null].filter(Boolean).join(' · ')),
    el('div', { class: 'muted' }, 'Periode: ' + periode),
    el('div', { class: 'muted' }, 'Jadwal rutin: ' + rutinText(s))
  ];
  const stats = [];
  if (s.kuota > 0) {
    const pct = Math.min(100, Math.round(s.used / s.kuota * 100));
    kids.push(el('div', { class: 'bar' + (s.used > s.kuota ? ' over' : '') }, el('div', { style: 'width:' + pct + '%' })));
    kids.push(el('div', { class: 'muted', style: 'margin-top:4px' },
      s.used + ' dari ' + s.kuota + ' visit terpakai' + (s.used > s.kuota ? ' (melebihi kuota)' : '')));
    stats.push(stat('Sisa visit', Math.max(0, s.sisa)), stat('Visit terpakai', s.used));
  }
  if (s.member) stats.push(stat('Member', s.hariSisa > 0 ? 'Aktif' : 'Berakhir'));
  stats.push(stat('Belum dibayar', rp(s.belum)), stat('Sudah dibayar', rp(s.lunas)));
  kids.push(el('div', { class: 'grid' }, stats));
  kids.push(el('div', { class: 'muted', style: 'margin-top:8px' },
    'Biaya per periode: Coaching ' + rp(s.biayaCoaching) + ' + Member ' + rp(s.biayaMember)));
  if (T) {
    const acts = [
      el('button', { class: 'link', onclick: () => { EDIT_ID = s.id; render(); } }, 'Edit'),
      el('button', { class: 'link', onclick: () => perpanjang(s) }, 'Perpanjang periode')
    ];
    if (s.kuota > 0 && s.sisa > 0 && s.hariSisa > 0 && waNumber(s.wa))
      acts.push(el('a', { class: 'wa', href: waLink(s), target: '_blank', rel: 'noopener' }, 'Kirim pengingat WA'));
    acts.push(el('button', { class: 'del', onclick: () => deleteClient(s) }, 'Hapus'));
    kids.push(el('div', { class: 'actions' }, acts));
  }
  return el('div', { class: 'card' }, kids);
}

function viewRingkasan() {
  const out = [];
  if (isTrainer()) out.push(addClientCard());
  if (!S.clients.length) {
    out.push(el('div', { class: 'empty' }, isTrainer()
      ? 'Belum ada client. Tambahkan lewat tombol di atas.'
      : 'Data kamu belum terdaftar. Hubungi trainer dan pastikan emailmu sudah didaftarkan.'));
    return out;
  }
  S.clients.map(summaryOf).forEach(s => out.push(isTrainer() && EDIT_ID === s.id ? editCard(s) : clientCard(s)));
  return out;
}

// ---------- Tab Jadwal ----------
function addJadwalCard() {
  const MAX_TGL = 8;
  const cs = clientSelect('j_email');
  const jmlSel = select('j_jml', Array.from({ length: MAX_TGL }, (_, i) => [String(i + 1), (i + 1) + ' tanggal']), '1');
  const info = el('div', { class: 'muted', style: 'margin-bottom:6px' });
  const rowsBox = el('div');
  const clientObj = () => S.clients.find(x => x.email === cs.value) || {};
  const fallback = { tanggal: '', mulai: '07:00', selesai: '08:00' };

  const rowEl = (i, r) => el('div', { class: 'jrow' },
    el('label', {}, 'Tanggal ke-' + (i + 1)),
    el('input', { type: 'date', value: r.tanggal || '' }),
    el('div', { class: 'two' },
      el('div', {}, el('label', {}, 'Jam mulai'), el('input', { type: 'time', value: r.mulai || '' })),
      el('div', {}, el('label', {}, 'Jam selesai'), el('input', { type: 'time', value: r.selesai || '' }))));
  const readRows = () => [...rowsBox.querySelectorAll('.jrow')].map(row => {
    const [a, b, c] = row.querySelectorAll('input');
    return { tanggal: a.value, mulai: b.value, selesai: c.value };
  });
  const draw = rows => rowsBox.replaceChildren(...rows.map((r, i) => rowEl(i, r)));

  // Isi ulang semua baris dari jadwal rutin client (mulai hari ini)
  const regen = () => {
    const n = Number(jmlSel.value);
    info.textContent = 'Jadwal rutin ' + (clientObj().nama || 'client') + ': ' + rutinText(clientObj());
    const g = nextRutin(clientObj(), n, today());
    draw(Array.from({ length: n }, (_, i) => g[i] || { ...fallback, tanggal: i === 0 ? today() : '' }));
  };
  // Ubah jumlah baris: pertahankan isian lama, tambahan baris mengikuti jadwal rutin
  jmlSel.onchange = () => {
    const n = Number(jmlSel.value);
    const rows = readRows().slice(0, n);
    const need = n - rows.length;
    if (need > 0) {
      const last = rows.length && rows[rows.length - 1].tanggal ? addDays(rows[rows.length - 1].tanggal, 1) : today();
      const g = nextRutin(clientObj(), need, last);
      for (let k = 0; k < need; k++) rows.push(g[k] || { ...fallback });
    }
    draw(rows);
  };
  cs.onchange = regen;
  regen();

  const btn = el('button', { class: 'primary' }, 'Simpan jadwal');
  btn.onclick = () => {
    const rows = readRows();
    if (rows.some(r => !r.tanggal || !r.mulai || !r.selesai)) return alert('Tanggal dan jam setiap baris wajib diisi.');
    if (rows.some(r => r.selesai <= r.mulai)) return alert('Jam selesai harus lebih besar dari jam mulai.');
    const keys = rows.map(r => r.tanggal + r.mulai);
    if (new Set(keys).size !== keys.length) return alert('Ada jadwal kembar (tanggal dan jam sama).');
    const email = cs.value;
    const dobel = rows.filter(r => S.jadwal.some(j => j.clientEmail === email && j.tanggal === r.tanggal && j.status !== 'Batal'));
    if (dobel.length && !confirm('Client ini sudah punya jadwal pada: ' + dobel.map(r => fmtTgl(r.tanggal)).join(', ') + '.\nTetap tambahkan?')) return;
    const bt = rows.flatMap(r => bentrok(r.tanggal, r.mulai, r.selesai, email).map(j => j.clientNama + ' (' + fmtTgl(j.tanggal) + ' ' + j.mulai + '-' + j.selesai + ')'));
    if (bt.length && !confirm('Bentrok dengan jadwal client lain:\n' + bt.join('\n') + '\n\nTetap tambahkan?')) return;
    const base = {
      clientEmail: email, clientNama: namaOf(email),
      jenis: val('j_jenis'), lokasi: val('j_lokasi'), catatan: val('j_catatan'), status: 'Terjadwal'
    };
    btn.disabled = true;
    const sorted = [...rows].sort((a, b) => (a.tanggal + a.mulai).localeCompare(b.tanggal + b.mulai));
    act(() => runBatched(sorted.map(r => b => b.set(doc(collection(db, 'jadwal')), { ...base, ...r }))));
  };

  return el('details', { class: 'card' }, el('summary', {}, '+ Tambah jadwal'),
    el('label', {}, 'Client'), cs,
    info,
    el('label', {}, 'Berapa tanggal sekaligus? (1-8)'), jmlSel,
    el('div', { class: 'muted' }, 'Tanggal & jam terisi otomatis sesuai jadwal rutin, tetap bisa diubah.'),
    rowsBox,
    el('button', { class: 'link', onclick: regen }, 'Isi ulang dari jadwal rutin'),
    el('label', {}, 'Jenis latihan'), el('input', { id: 'j_jenis', placeholder: 'Contoh: Strength - Upper Body' }),
    el('label', {}, 'Lokasi'), el('input', { id: 'j_lokasi' }),
    el('label', {}, 'Catatan'), el('input', { id: 'j_catatan' }),
    btn);
}

function reschedCard(j) {
  const d = el('input', { type: 'date', min: today(), value: j.tanggal });
  const m = el('input', { type: 'time', value: j.mulai });
  const s = el('input', { type: 'time', value: j.selesai });
  const save = el('button', { class: 'primary' }, 'Simpan jadwal baru');
  save.onclick = async () => {
    if (!d.value || !m.value || !s.value) return alert('Tanggal dan jam wajib diisi.');
    if (d.value < today()) return alert('Tanggal tidak boleh di masa lalu.');
    if (s.value <= m.value) return alert('Jam selesai harus lebih besar dari jam mulai.');
    if (d.value === j.tanggal && m.value === j.mulai && s.value === j.selesai) return alert('Jadwal belum diubah.');
    save.disabled = true;
    const nama = (S.clients[0] && S.clients[0].nama) || j.clientNama;
    const ok = await act(async () => {
      await runBatched([
        b => b.update(doc(db, 'jadwal', j.id), {
          tanggal: d.value, mulai: m.value, selesai: s.value,
          diubahClient: true, tanggalAsal: j.tanggal, mulaiAsal: j.mulai, selesaiAsal: j.selesai
        }),
        b => b.set(doc(collection(db, 'notif')), {
          tipe: 'reschedule', clientEmail: j.clientEmail, clientNama: nama, jadwalId: j.id,
          dari: { tanggal: j.tanggal, mulai: j.mulai, selesai: j.selesai },
          ke: { tanggal: d.value, mulai: m.value, selesai: s.value },
          dibuat: new Date().toISOString(), dibaca: false
        })
      ]);
      RESCH_ID = null;
    });
    if (ok) alert('Jadwal berhasil diubah. Trainer sudah mendapat pemberitahuan.');
  };
  return el('div', { class: 'card item' },
    el('b', {}, 'Ubah jadwal'),
    el('div', { class: 'muted', style: 'margin-bottom:6px' }, 'Sekarang: ' + hariTgl(j.tanggal) + ' · ' + j.mulai + '-' + j.selesai),
    el('label', {}, 'Tanggal baru'), d,
    el('div', { class: 'two' },
      el('div', {}, el('label', {}, 'Jam mulai'), m),
      el('div', {}, el('label', {}, 'Jam selesai'), s)),
    el('div', { class: 'muted', style: 'margin-bottom:8px' }, 'Trainer akan mendapat pemberitahuan tentang perubahan ini.'),
    save,
    el('button', { class: 'link', onclick: () => { RESCH_ID = null; render(); } }, 'Batal'));
}

function viewJadwal() {
  const out = [];
  const T = isTrainer();
  if (T) {
    if (!S.clients.length) out.push(el('div', { class: 'empty' }, 'Tambahkan client dulu di tab Ringkasan.'));
    else out.push(addJadwalCard());
  }
  if (!S.jadwal.length) out.push(el('div', { class: 'empty' }, 'Belum ada jadwal.'));
  S.jadwal.forEach(j => {
    if (!T && RESCH_ID === j.id) { out.push(reschedCard(j)); return; }
    const onStatus = async v => {
      await updateDoc(doc(db, 'jadwal', j.id), { status: v });
      const c = S.clients.find(x => x.email === j.clientEmail);
      if (v === 'Selesai' && c && Number(c.coaching) > 0 && !S.visit.some(x => x.jadwalId === j.id)
          && confirm('Catat sebagai 1 visit untuk ' + j.clientNama + '?')) {
        await addDoc(collection(db, 'visit'), { clientEmail: j.clientEmail, clientNama: j.clientNama, tanggal: j.tanggal, catatan: j.jenis || '', jadwalId: j.id });
      }
    };
    const canResched = !T && j.status === 'Terjadwal' && j.tanggal >= today();
    out.push(el('div', { class: 'card item' },
      el('div', { class: 'row' }, el('b', {}, hariTgl(j.tanggal) + ' · ' + j.mulai + '-' + j.selesai),
        T ? statusSelect(['Terjadwal', 'Selesai', 'Batal'], j.status, onStatus) : badgeFor(j.status)),
      j.jenis ? el('div', {}, j.jenis) : null,
      el('div', { class: 'muted' }, [T ? j.clientNama : null, j.lokasi].filter(Boolean).join(' · ')),
      j.catatan ? el('div', { class: 'muted' }, 'Catatan: ' + j.catatan) : null,
      j.diubahClient ? el('div', { class: 'muted' }, '↻ Diubah client, sebelumnya ' + hariTgl(j.tanggalAsal) + ' · ' + j.mulaiAsal + '-' + j.selesaiAsal) : null,
      canResched ? el('button', { class: 'link', onclick: () => { RESCH_ID = j.id; render(); } }, 'Ubah jadwal') : null,
      T ? delBtn('jadwal', j.id) : null));
  });
  return out;
}

// ---------- Tab Notif (trainer) ----------
function viewNotif() {
  const out = [];
  const unread = S.notif.filter(n => !n.dibaca);
  out.push(el('div', { class: 'row' },
    el('h4', {}, 'Perubahan jadwal dari client (' + unread.length + ' belum dibaca)'),
    unread.length ? el('button', { class: 'link', onclick: () => act(() => runBatched(unread.map(n => b => b.update(doc(db, 'notif', n.id), { dibaca: true })))) }, 'Tandai semua dibaca') : null));
  if (!S.notif.length) out.push(el('div', { class: 'empty' }, 'Belum ada pemberitahuan.'));
  S.notif.forEach(n => {
    const dari = n.dari || {}, ke = n.ke || {};
    const bt = bentrok(ke.tanggal, ke.mulai, ke.selesai, n.clientEmail, n.jadwalId);
    out.push(el('div', { class: 'card item' + (n.dibaca ? '' : ' unread') },
      el('div', { class: 'row' }, el('b', {}, n.clientNama + ' mengubah jadwal'), n.dibaca ? null : el('span', { class: 'badge amber' }, 'Baru')),
      el('div', { class: 'muted' }, 'Dari: ' + hariTgl(dari.tanggal) + ' · ' + dari.mulai + '-' + dari.selesai),
      el('div', {}, 'Ke: ' + hariTgl(ke.tanggal) + ' · ' + ke.mulai + '-' + ke.selesai),
      bt.length ? el('div', { class: 'warnline' }, '⚠ Bentrok dengan: ' + bt.map(j => j.clientNama + ' (' + j.mulai + '-' + j.selesai + ')').join(', ')) : null,
      el('div', { class: 'muted' }, 'Dikirim ' + waktuText(n.dibuat)),
      el('div', { class: 'actions' },
        n.dibaca ? null : el('button', { class: 'link', onclick: () => act(() => updateDoc(doc(db, 'notif', n.id), { dibaca: true })) }, 'Tandai dibaca'),
        el('button', { class: 'del', onclick: () => act(() => deleteDoc(doc(db, 'notif', n.id))) }, 'Hapus'))));
  });
  return out;
}

// ---------- Tab Visit ----------
function viewVisit() {
  const out = [];
  const T = isTrainer();
  const sums = S.clients.map(summaryOf);
  const withQuota = sums.filter(s => s.kuota > 0);

  if (T) {
    if (!withQuota.length) out.push(el('div', { class: 'empty' }, 'Belum ada client dengan paket coaching. Atur paket di tab Ringkasan.'));
    else {
      const btn = el('button', { class: 'primary' }, 'Catat visit');
      btn.onclick = () => {
        const tanggal = val('v_tgl');
        if (!tanggal) return alert('Tanggal wajib diisi.');
        const email = $('v_email').value;
        btn.disabled = true;
        act(() => addDoc(collection(db, 'visit'), { clientEmail: email, clientNama: namaOf(email), tanggal, catatan: val('v_catatan'), jadwalId: '' }));
      };
      out.push(el('details', { class: 'card', open: '' }, el('summary', {}, '+ Catat visit'),
        el('label', {}, 'Client'), clientSelect('v_email', withQuota),
        el('label', {}, 'Tanggal visit'), el('input', { id: 'v_tgl', type: 'date', value: today() }),
        el('label', {}, 'Catatan (opsional)'), el('input', { id: 'v_catatan', placeholder: 'Contoh: Leg day' }),
        btn));
    }
  }

  if (withQuota.length) {
    out.push(el('div', { class: 'card' }, el('h3', {}, 'Kuota visit periode ini'),
      withQuota.map(s => el('div', { style: 'margin-top:10px' },
        el('div', { class: 'row' }, el('span', {}, s.nama), el('b', {}, s.used + ' / ' + s.kuota + ' visit')),
        el('div', { class: 'bar' + (s.used > s.kuota ? ' over' : '') }, el('div', { style: 'width:' + Math.min(100, Math.round(s.used / s.kuota * 100)) + '%' })),
        el('div', { class: 'muted' }, 'Sisa ' + Math.max(0, s.sisa) + ' visit · ' + fmtTgl(s.mulai) + ' – ' + fmtTgl(s.selesai) +
          (s.hariSisa > 0 ? ' (sisa ' + s.hariSisa + ' hari)' : ' (berakhir)'))))));
  } else if (!T) {
    out.push(el('div', { class: 'empty' }, 'Paketmu tidak memiliki kuota visit coaching.'));
  }

  out.push(el('h4', {}, 'Riwayat visit'));
  if (!S.visit.length) out.push(el('div', { class: 'empty' }, 'Belum ada visit tercatat.'));
  S.visit.forEach(v => {
    const s = sums.find(x => x.email === v.clientEmail);
    const inPeriod = s && v.tanggal >= s.mulai && v.tanggal < s.selesai;
    out.push(el('div', { class: 'card item' },
      el('div', { class: 'row' }, el('b', {}, fmtTgl(v.tanggal)), inPeriod ? el('span', { class: 'badge ok' }, 'Periode ini') : el('span', { class: 'badge' }, 'Periode lalu')),
      el('div', { class: 'muted' }, [T ? v.clientNama : null, v.catatan].filter(Boolean).join(' · ')),
      T ? delBtn('visit', v.id) : null));
  });
  return out;
}

// ---------- Tab Bayar ----------
function payItem(b) {
  const T = isTrainer();
  const lunas = b.status === 'Lunas';
  return el('div', { class: 'card item' },
    el('div', { class: 'row' }, el('b', {}, rp(b.jumlah)),
      T ? statusSelect(['Belum Dibayar', 'Lunas'], b.status,
        v => updateDoc(doc(db, 'pembayaran', b.id), { status: v, tanggalBayar: v === 'Lunas' ? today() : '' })) : badgeFor(b.status)),
    el('div', { class: 'muted' }, [b.jenis, T ? b.clientNama : null,
      lunas ? 'Dibayar ' + fmtTgl(b.tanggalBayar || b.tanggal) : 'Tagihan ' + fmtTgl(b.tanggal), b.metode].filter(Boolean).join(' · ')),
    b.ket ? el('div', { class: 'muted' }, b.ket) : null,
    T ? delBtn('pembayaran', b.id) : null);
}

function viewBayar() {
  const out = [];
  const T = isTrainer();
  const sum = list => list.reduce((s, b) => s + Number(b.jumlah || 0), 0);
  const belum = S.bayar.filter(b => b.status !== 'Lunas');
  const lunas = S.bayar.filter(b => b.status === 'Lunas');

  if (T) {
    if (!S.clients.length) out.push(el('div', { class: 'empty' }, 'Tambahkan client dulu di tab Ringkasan.'));
    else {
      const cs = clientSelect('b_email');
      const jenis = select('b_jenis', [['Coaching', 'Coaching'], ['Member', 'Member']], 'Coaching');
      const jumlah = el('input', { id: 'b_jumlah', type: 'number', inputmode: 'numeric', min: '0' });
      const fill = () => {
        const c = S.clients.find(x => x.email === cs.value) || {};
        const n = jenis.value === 'Coaching' ? Number(c.coaching || 0) * TARIF_VISIT : TARIF_MEMBER;
        jumlah.value = n > 0 ? n : '';
      };
      cs.onchange = fill; jenis.onchange = fill; fill();
      const btn = el('button', { class: 'primary' }, 'Simpan pembayaran');
      btn.onclick = () => {
        const n = Number(jumlah.value);
        if (!(n > 0)) return alert('Jumlah harus lebih dari 0.');
        const tanggal = val('b_tgl');
        if (!tanggal) return alert('Tanggal wajib diisi.');
        const status = $('b_status').value;
        btn.disabled = true;
        act(() => addDoc(collection(db, 'pembayaran'), {
          clientEmail: cs.value, clientNama: namaOf(cs.value), tanggal, jenis: jenis.value, jumlah: n,
          metode: $('b_metode').value, ket: val('b_ket'), status, tanggalBayar: status === 'Lunas' ? tanggal : ''
        }));
      };
      out.push(el('details', { class: 'card' }, el('summary', {}, '+ Catat pembayaran / tagihan'),
        el('label', {}, 'Client'), cs,
        el('label', {}, 'Tanggal'), el('input', { id: 'b_tgl', type: 'date', value: today() }),
        el('label', {}, 'Jenis biaya'), jenis,
        el('label', {}, 'Jumlah (Rp), terisi otomatis sesuai paket, bisa diubah'), jumlah,
        el('label', {}, 'Metode'), select('b_metode', [['Transfer', 'Transfer'], ['Tunai', 'Tunai'], ['E-Wallet', 'E-Wallet']], 'Transfer'),
        el('label', {}, 'Keterangan'), el('input', { id: 'b_ket', placeholder: 'Contoh: Cicilan 1 dari 2' }),
        el('label', {}, 'Status'), select('b_status', [['Lunas', 'Lunas'], ['Belum Dibayar', 'Belum Dibayar']], 'Lunas'),
        btn));
    }
  }

  out.push(el('div', { class: 'card' }, el('h3', {}, T ? 'Ringkasan pembayaran (semua client)' : 'Ringkasan pembayaran'),
    el('div', { class: 'grid' }, stat('Belum dibayar', rp(sum(belum))), stat('Sudah dibayar', rp(sum(lunas))))));

  out.push(el('h4', {}, 'Belum dibayar (' + belum.length + ')'));
  if (!belum.length) out.push(el('div', { class: 'empty' }, 'Tidak ada tagihan yang belum dibayar.'));
  belum.forEach(b => out.push(payItem(b)));

  out.push(el('h4', {}, 'Sudah dibayar (' + lunas.length + ')'));
  if (!lunas.length) out.push(el('div', { class: 'empty' }, 'Belum ada pembayaran lunas.'));
  lunas.forEach(b => out.push(payItem(b)));
  return out;
}
</script>
</body>
</html>
